spring.application.name=farm-management
server.port=8080

# --- PostgreSQL (create the database first: CREATE DATABASE farmverse_nexus;) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmverse_nexus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:rootpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- File upload (land documents) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:uploads}
